</header>


<main>

<section class="section">

    <div class="container">

        <h1>Order From Our Bakery</h1>

        <img
            src="images/order.jpg"
            alt="Bakery cake available for ordering"
            class="feature-image"
        >

        <p>
            Complete the form below to send a bakery order request.
        </p>


        <form id="order-form">

            <div class="form-group">

                <label for="order-name">
                    Name
                </label>

                <input
                    type="text"
                    id="order-name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="order-email">
                    Email
                </label>

                <input
                    type="email"
                    id="order-email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="product">
                    Select Product
                </label>

                <select id="product" name="product">

                    <option value="croissant">
                        Croissant
                    </option>

                    <option value="bread">
                        Sourdough Bread
                    </option>

                    <option value="cake">
                        Chocolate Cake
                    </option>

                    <option value="cinnamon-roll">
                        Cinnamon Roll
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="order-color">
                    Preferred Decoration Color
                </label>

                <input
                    type="color"
                    id="order-color"
                    name="decoration-color"
                >

            </div>


            <div class="form-group">

                <label for="order-message">
                    Order Details
                </label>

                <textarea
                    id="order-message"
                    name="message"
                    placeholder="Write your order details here..."
                ></textarea>

            </div>


            <button class="btn" type="submit">
                Send Order
            </button>

        </form>

    </div>

</section>

</main>
